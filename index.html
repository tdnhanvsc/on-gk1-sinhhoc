<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6BFF">
<meta name="description" content="Ôn tập Sinh học 12 giữa học kỳ I: DNA, biểu hiện gene, đột biến và quy luật di truyền. Luyện tập, thi thử, đảo đề, giải thích đáp án.">
<title>Sinh học 12 · Trạm ôn tập</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E6BFF'/%3E%3Ctext x='32' y='45' font-size='30' text-anchor='middle' fill='white'%3ESH%3C/text%3E%3C/svg%3E">
<style>
/* Màu sắc và bố cục dùng chung, không tải font hay tài nguyên bên ngoài. */
:root{--blue:#1E6BFF;--blue-light:#EEF4FF;--green:#22B573;--red:#F04438;--orange:#F79009;--ink:#172B4D;--muted:#63718A;--line:#E3E8F0;--bg:#F4F6FA;--shadow:0 4px 24px rgba(23,43,77,.045)}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button,select{cursor:pointer}
button{touch-action:manipulation}
button:disabled{cursor:default;opacity:.65}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #8CB4FF;outline-offset:3px}
a{color:var(--blue)}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{line-height:1.3;letter-spacing:-.025em}
button{color:inherit}
button svg{flex-shrink:0}
svg{vertical-align:middle}
button,.card,select{border-radius:12px}
.hidden,[hidden]{display:none!important}
.wrap{max-width:1200px;margin:auto;padding:0 32px}
.site-header{background:white;border-bottom:1px solid var(--line)}
.brand-row{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;text-align:left}
.logo{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:white;border-radius:12px}
.brand strong{display:block;font-size:19px;line-height:1.3}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:3px}
.header-note{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:var(--blue-light);color:var(--blue);font-size:12px;font-weight:650}
.pill.orange{color:#955508;background:#FFF3DF}
.pill.green{color:#127447;background:#E8F8EF}
.hero{padding:48px 0 32px;display:grid;grid-template-columns:1.45fr 1fr;align-items:center;gap:48px}
.eyebrow{color:var(--blue);font-size:11px;letter-spacing:.16em;font-weight:750;margin-bottom:14px}
.hero h1{font-size:42px;line-height:1.2;margin-bottom:16px;letter-spacing:-.045em}
.hero h1 span{color:var(--blue)}
.hero p{max-width:530px;color:var(--muted);margin-bottom:18px}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px}
.overview{background:white;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow);display:flex;align-items:center;gap:24px}
.overview .ring{width:116px;height:116px;flex-shrink:0;background:conic-gradient(var(--blue) 0% 88.1%,#B7CFFF 88.1% 98.4%,var(--green) 98.4% 100%);padding:9px}
.ring{border-radius:50%;display:grid;place-items:center}
.ring-inner{background:white;border-radius:50%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column}
.overview .ring strong{font-size:32px;line-height:1.2}
.ring small{font-size:11px;color:var(--muted)}
.overview h2{font-size:16px;margin-bottom:12px}
.overview p{font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--blue)}
.dot.light{background:#B7CFFF}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
.section-heading h2{font-size:21px;margin:0}
.section-heading p{margin:3px 0 0;color:var(--muted);font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin:22px 0}
.tabs{padding:4px;background:#E9EDF4;border-radius:12px;display:flex;gap:3px}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 16px;font-weight:600;font-size:13px;border-radius:9px}
.tab.active{background:white;color:var(--blue);box-shadow:0 2px 5px #14294D0C}
.filter{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
select{border:1px solid var(--line);padding:9px 30px 9px 12px;background:white;color:var(--ink);max-width:100%}
.exam-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{background:white;border:1px solid var(--line);box-shadow:var(--shadow)}
.exam-card{padding:23px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.exam-card.comprehensive{background:linear-gradient(135deg,#fff 35%,#EEF4FF)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:21px}
.chapter-icon{background:var(--blue-light);color:var(--blue);border-radius:12px;width:46px;height:46px;display:grid;place-items:center}
.exam-card h3{font-size:18px;margin-bottom:9px}
.exam-card .description{color:var(--muted);font-size:13px;min-height:42px;margin-bottom:19px}
.meta{display:flex;gap:20px;font-size:13px;color:var(--muted);padding-bottom:19px;margin-top:auto}
.meta span{display:flex;align-items:center;gap:6px}
.card-bottom{border-top:1px solid var(--line);padding-top:17px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);gap:12px}
.btn{border:1px solid var(--line);background:white;padding:10px 16px;font-weight:650;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.5;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:white}
.btn.primary:hover{background:#155BE0}
.btn:hover{filter:brightness(.98)}
.btn.soft{background:var(--blue-light);color:var(--blue);border-color:transparent}
.btn.danger{color:var(--red)}
.text-button{border:0;background:none;color:var(--blue);font-size:13px;font-weight:600;padding:5px}
.note{padding:15px 18px;color:var(--muted);background:white;border:1px solid var(--line);border-radius:12px;font-size:13px;margin-top:22px}
.note strong{color:var(--ink)}
.history-section{margin-top:38px}
.history-box{overflow-x:auto}
.history-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.history-table th,.history-table td{text-align:left;padding:16px 20px;border-bottom:1px solid var(--line)}
.history-table tr:last-child td{border:0}
.history-table th{font-weight:500;color:var(--muted);font-size:12px;background:#FBFCFE}
.score-small{color:var(--blue);font-weight:750}
.empty{padding:32px;text-align:center;color:var(--muted);font-size:13px}
.empty svg{display:block;margin:0 auto 10px;color:#A2AEC1}
.footer{padding:30px 0;color:var(--muted);font-size:12px;text-align:center}
.footer span{color:var(--blue)}

/* Thanh thi và bảng câu hỏi: hai cột trên màn hình lớn, ngăn dưới trên điện thoại. */
.exam-topbar{position:sticky;top:0;background:white;z-index:20;border-bottom:1px solid var(--line)}
.exam-topbar .wrap{min-height:80px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:15px}
.exam-title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exam-subtitle{font-size:12px;font-weight:400;color:var(--muted)}
.timer-box{text-align:center}
.timer-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.timer{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--blue);line-height:1.3}
.timer.urgent{color:var(--red)}
.top-actions{justify-self:end;display:flex;gap:8px}
.exam-layout{display:grid;grid-template-columns:minmax(0,7fr) minmax(265px,3fr);gap:24px;padding-top:25px;padding-bottom:35px;align-items:start}
.exam-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.exam-tools .tabs .tab{padding:7px 11px;font-size:12px}
.exam-tools>span{color:var(--muted);font-size:12px}
.part-label{display:flex;align-items:center;gap:10px;margin:24px 0 13px;font-weight:700;font-size:14px}
.part-label:first-child{margin-top:0}
.part-label span{background:#E4EBF6;color:#536783;border-radius:6px;padding:2px 7px;font-size:11px;letter-spacing:.04em}
.question-card{padding:26px;margin-bottom:18px;scroll-margin-top:102px;overflow-wrap:anywhere}
.question-heading{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.question-heading h2{font-size:17px;margin:0}
.question-source{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:5px;letter-spacing:0}
.question-text,.statement-text,.explanation,.original-text{white-space:pre-line}
.question-text{font-size:16px;line-height:1.75;margin-bottom:22px}
.question-image{display:block;max-width:100%;max-height:200px;width:auto;margin:12px 0 22px;image-rendering:auto}
.options{display:grid;gap:11px}
.option{width:100%;text-align:left;display:flex;align-items:center;gap:13px;line-height:1.6;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:white;font-size:15px;opacity:1!important}
.option:hover:not(:disabled){border-color:#94BAFF;background:#FAFCFF}
.letter{border:1px solid #CFD7E5;min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:650;align-self:flex-start;margin-top:1px}
.option.selected{border-color:var(--blue);background:var(--blue-light)}
.option.selected .letter{background:var(--blue);border-color:var(--blue);color:white}
.option.correct{border-color:var(--green);background:#F0FBF5}
.option.correct .letter{background:var(--green);border-color:var(--green);color:white}
.option.incorrect{border-color:var(--red);background:#FFF3F1}
.option.incorrect .letter{background:var(--red);border-color:var(--red);color:white}
.choice-content{flex:1;white-space:pre-line}
.choice-mark{font-size:11px;font-weight:700;color:#12834D;white-space:nowrap}
.incorrect .choice-mark{color:var(--red)}
.question-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:23px;border-top:1px solid var(--line);padding-top:18px;flex-wrap:wrap}
.navigation{display:flex;gap:8px}
.flag-button{border:0;background:#FFF8EC;color:#9A630B;font-size:12px;padding:8px 12px;display:inline-flex;gap:5px;align-items:center;border-radius:8px}
.flag-button.flagged{background:#FFF0D8;color:#965207;font-weight:750}
.question-aside{position:sticky;top:105px;padding:22px;max-height:calc(100vh - 125px);overflow-y:auto}
.aside-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}
.aside-title h2{font-size:16px;margin:0}
.aside-progress{font-size:12px;color:var(--muted);margin:0 0 6px}
.progress-track{height:5px;border-radius:10px;background:#EDF0F6;overflow:hidden;margin-bottom:20px}
.progress-fill{height:100%;background:var(--blue);transition:width .2s}
.grid-label{font-size:11px;font-weight:700;color:var(--muted);margin:13px 0 9px;text-transform:uppercase;letter-spacing:.04em}
.question-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(35px,1fr));gap:8px}
.q-number{height:36px;min-width:0;border:1px solid #CDD6E4;background:white;border-radius:7px;font-size:12px;position:relative;padding:0}
.q-number.answered{background:var(--blue);border-color:var(--blue);color:white}
.q-number.partial{background:#EEF4FF;border-color:#8DB6FF;color:#1A5DCA}
.q-number.flagged{background:var(--orange);border-color:var(--orange);color:white}
.q-number.correct{background:var(--green);border-color:var(--green);color:white}
.q-number.incorrect{background:var(--red);border-color:var(--red);color:white}
.q-number.blank{background:#EEF0F4;border-color:#D4D9E2;color:#727D8D}
.q-number.current{outline:2px solid #233B60;outline-offset:2px}
.q-number.partial-score{background:#FFF2DD;border-color:#F79009;color:#915307}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11px;color:var(--muted);margin-top:23px;padding-top:17px;border-top:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border:1px solid #CCD5E3;border-radius:3px;background:white}
.legend .blue{background:var(--blue);border-color:var(--blue)}
.legend .orange{background:var(--orange);border-color:var(--orange)}
.legend .green{background:var(--green);border-color:var(--green)}
.legend .red{background:var(--red);border-color:var(--red)}
.legend .gray{background:#D5DAE3;border-color:#D5DAE3}
.aside-note{font-size:11px;color:var(--muted);margin:17px 0 0}
.mobile-grid-toggle{display:none}
.drawer-overlay{position:fixed;inset:0;background:#172B4D66;z-index:49}
.close-drawer{display:none;border:0;background:#EEF1F6;border-radius:8px;padding:4px 8px}
.statement{border:1px solid var(--line);padding:15px;border-radius:10px;margin-top:12px}
.statement.correct{border-color:var(--green);background:#F4FCF7}
.statement.incorrect{border-color:var(--red);background:#FFF7F6}
.statement-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.statement-text{flex:1}
.tf-controls{display:flex;gap:6px;flex-shrink:0}
.tf-choice{font-size:12px;border:1px solid #CFD7E5;background:white;border-radius:8px;padding:7px 11px;opacity:1!important}
.tf-choice.selected{background:var(--blue);border-color:var(--blue);color:white}
.tf-choice.right{border-color:var(--green);background:var(--green);color:white}
.tf-choice.wrong{border-color:var(--red);background:var(--red);color:white}
.statement-feedback{font-size:13px;margin-top:12px;border-top:1px solid #DAE4DC;padding-top:10px}
.explanation{padding:17px 19px;background:#EEF7FF;border-radius:10px;margin-top:20px;color:#304C70;font-size:14px}
.explanation strong{display:block;margin-bottom:5px;color:#174D93}
.answer-summary{font-size:13px;color:var(--muted);margin-top:16px}
.edit-details{margin-top:18px;border:1px dashed #D7DFED;border-radius:9px;font-size:12px;padding:11px 13px;background:#FCFDFE;color:var(--muted)}
.edit-details summary{cursor:pointer;color:#536783;font-weight:650}
.edit-details p{margin:11px 0 0}
.original-text{padding:10px;background:#F0F3F8;border-radius:6px;margin-top:10px}
.review-alert{font-size:12px;padding:10px 13px;background:#FFF5DF;color:#87580B;border-radius:8px;margin-bottom:16px}
.result-wrap{max-width:950px;margin:auto;padding:35px 28px}
.breadcrumb{font-size:13px;color:var(--muted);margin-bottom:23px}
.result-card{padding:35px;text-align:center}
.result-card h1{font-size:26px;margin:12px 0 7px}
.result-card>p{color:var(--muted);font-size:13px}
.result-main{display:flex;align-items:center;justify-content:center;gap:40px;margin:30px 0}
.result-ring{background:#E9EFF8;width:142px;height:142px;padding:10px}
.result-ring strong{font-size:28px}
.big-score{font-size:64px;line-height:1;font-weight:800;letter-spacing:-.06em;color:var(--blue)}
.big-score small{font-size:24px;color:#97A4BA;letter-spacing:0}
.score-caption{font-size:12px;color:var(--muted);margin-top:10px}
.result-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:28px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{padding:18px 10px;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat strong{display:block;font-size:23px}
.stat span{font-size:12px;color:var(--muted)}
.green-text{color:#14864F}
.red-text{color:var(--red)}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:27px}
.result-detail{margin-top:20px;padding:23px;font-size:13px;color:var(--muted)}
.result-detail h2{font-size:16px;color:var(--ink)}
.result-detail p:last-child{margin-bottom:0}
.modal-backdrop{position:fixed;inset:0;background:#172B4D77;z-index:100;display:grid;place-items:center;padding:20px}
.modal{background:white;width:100%;max-width:520px;border-radius:18px;box-shadow:0 20px 100px #172B4D33;max-height:calc(100dvh - 40px);max-height:calc(100vh - 40px);overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:23px 25px 0;gap:12px}
.modal-head h2{font-size:21px;margin:0}
.icon-button{border:0;background:#F0F3F8;border-radius:8px;width:32px;height:32px;display:grid;place-items:center}
.modal-body{padding:20px 25px 25px}
.modal-description{color:var(--muted);font-size:13px;margin-bottom:18px}
.field{margin:18px 0}
.field label{font-size:13px;display:block;font-weight:650;margin-bottom:8px}
.field select{width:100%;padding:11px}
.mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-button{text-align:left;border:1px solid var(--line);padding:13px;background:white}
.mode-button.active{border-color:var(--blue);background:var(--blue-light)}
.mode-button strong{display:block;font-size:14px}
.mode-button small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:25px}
.modal-note{padding:12px 14px;background:#F4F7FC;border-radius:9px;color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#172B4D;color:white;border-radius:10px;box-shadow:var(--shadow);padding:12px 20px;max-width:calc(100% - 32px);z-index:200;font-size:13px;text-align:center}
.skip-link{position:fixed;top:-100px;left:15px;z-index:300;background:white;padding:10px;border-radius:8px}
.skip-link:focus{top:10px}

@media(min-width:1100px){.exam-card.comprehensive{grid-column:1/-1;display:grid;grid-template-columns:54px 1.4fr 1fr auto;gap:18px;align-items:center}
.comprehensive .card-top{margin:0}
.comprehensive .card-top .pill{display:none}
.comprehensive h3{margin-bottom:4px}
.comprehensive .description{min-height:0;margin:0}
.comprehensive .meta{padding:0;margin:0}
.comprehensive .card-bottom{border:0;padding:0;gap:20px}
}

@media(max-width:1000px){.hero{gap:24px}
.hero h1{font-size:35px}
.overview{gap:15px;padding:20px}
.overview .ring{width:92px;height:92px}
.exam-cards{gap:14px}
.exam-card{padding:19px}
.question-card{padding:22px}
.question-aside{padding:18px}
.wrap{padding:0 24px}
}

@media(max-width:760px){.wrap{padding:0 16px}
.brand-row{min-height:68px}
.brand strong{font-size:17px}
.logo{width:37px;height:37px}
.header-note{font-size:11px}
.header-note .desktop-only{display:none}
.hero{padding:30px 0 26px;grid-template-columns:1fr;gap:22px}
.hero h1{font-size:34px}
.hero p{font-size:14px}
.overview{padding:18px 22px;justify-content:space-between;flex-direction:row-reverse;gap:15px}
.overview .ring{width:85px;height:85px;padding:7px}
.overview .ring strong{font-size:27px}
.overview h2{margin-bottom:6px}
.overview p{font-size:12px}
.toolbar{gap:13px}
.tabs{max-width:100%;overflow:auto}
.tab{padding:8px 13px;white-space:nowrap}
.filter{width:100%;justify-content:space-between}
.filter select{flex:1;min-width:0;max-width:280px}
.exam-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.exam-card.comprehensive{grid-column:1/-1}
.exam-card .description{min-height:42px}
.section-heading h2{font-size:19px}
.section-heading .pill{font-size:10px}
.exam-topbar .wrap{min-height:75px;grid-template-columns:minmax(0,1fr) auto auto;gap:12px}
.exam-title{font-size:13px;max-width:250px}
.exam-subtitle{font-size:10px}
.timer{font-size:19px}
.timer-label{font-size:8px;letter-spacing:.03em}
.top-actions .btn{padding:8px 10px;font-size:12px}
.top-actions .home-review{display:none}
.exam-layout{display:block;padding-top:18px;padding-bottom:85px}
.question-card{padding:20px;margin-bottom:14px}
.question-text{font-size:15px}

function shuffled(array) {

function questionTable(q) {
  if(!q.table)return '';
  return '<div class="source-table-wrap"><table class="source-table"><caption>Bảng thông tin trong đề gốc</caption><thead><tr>'+q.table.headers.map(t=>'<th scope="col">'+escapeHTML(t)+'</th>').join('')+'</tr></thead><tbody>'+q.table.rows.map(row=>'<tr>'+row.map(t=>'<td>'+escapeHTML(t)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function originalDetails(q) {
  if(!q.editNote && !q.needReview)return '';
  return `<details class="edit-details"><summary>${q.editNote?'Đã biên tập · Xem ghi chú & bản gốc':'Cần kiểm tra · Xem lưu ý đáp án'}</summary>${q.editNote?`<p><strong>Điều chỉnh:</strong> ${escapeHTML(q.editNote)}</p><p>Nhãn A/B/C/D trong ghi chú và bản gốc là thứ tự trước khi đảo đáp án.</p>`:''}${q.reviewNote?`<p><strong>Cần kiểm tra:</strong> ${escapeHTML(q.reviewNote)}</p>`:''}${q.originalPrompt?`<div class="original-text"><strong>Câu gốc:</strong> ${escapeHTML(q.originalPrompt)}</div>`:''}${q.originalOptions?`<div class="original-text">${q.originalOptions.map((x,i)=>`${LETTERS[i]}. ${escapeHTML(x)}`).join('\n')}</div>`:''}${q.originalStatements?`<div class="original-text">${q.originalStatements.map((x,i)=>`${'abcd'[i]}. ${escapeHTML(typeof x==='string'?x:x.text)}`).join('\n')}</div>`:''}</details>`;
}

/* Chuẩn hóa có giới hạn: chấp nhận dấu phân cách của chuỗi thứ tự và số thập phân Việt Nam. */
function normalizeShort(q,value) {
  if(value==null)return null;
  const text=String(value).normalize('NFKC').trim();
  if(!text)return null;
  if(q.short.format==='sequence'){
    if(!/^\d+(?:[\s,;→>–—-]+\d+)*$/.test(text))return null;
    const compact=text.replace(/[\s,;→>–—-]/g,'');
    return /^\d+$/.test(compact)?compact:null;
  }
  const compact=text.replace(/\s+/g,'').replace(',','.');
  if(!/^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$/.test(compact))return null;
  const number=Number(compact);return Number.isFinite(number)?String(number):null;
}
function shortIsCorrect(q,value) {
  const answer=normalizeShort(q,value);
  return answer!==null&&normalizeShort(q,q.short.answer)===answer;
}
function shortHTML(q,i) {
  const s=state.session,a=s.answers[q.id]||'',feedback=s.submitted||s.mode==='practice'&&s.checked[q.id],invalid=!!a.trim()&&normalizeShort(q,a)===null;
  const hint=q.short.format==='sequence'?'Viết liền các số theo thứ tự, hoặc dùng khoảng trắng/dấu →.':'Nhập một số, không thêm đơn vị; có thể dùng dấu phẩy thập phân.';
  const right=shortIsCorrect(q,a);
  return `<label class="short-label" for="short-${i}">Câu trả lời của bạn</label><div class="short-row"><input id="short-${i}" class="short-input ${feedback?(right?'right':'wrong'):''}" data-short-index="${i}" type="text" inputmode="${q.short.format==='sequence'?'numeric':'decimal'}" autocomplete="off" spellcheck="false" maxlength="50" value="${escapeHTML(a)}" aria-describedby="short-hint-${i} short-error-${i}" aria-invalid="${invalid}" ${feedback?'readonly':''} placeholder="${q.short.format==='sequence'?'Ví dụ: 1234':'Nhập đáp án…'}">${s.mode==='practice'&&!s.submitted?`<button class="btn primary" data-action="check-short" data-index="${i}" ${feedback||!a.trim()||invalid?'disabled':''}>Kiểm tra đáp án</button>`:''}</div><p class="short-hint" id="short-hint-${i}">${hint}${s.mode==='exam'&&!s.submitted?' Đáp án sẽ được chấm khi nộp bài.':''}</p><p class="field-error" id="short-error-${i}" ${invalid?'':'hidden'}>Định dạng chưa hợp lệ. ${hint}</p>${feedback?`<div class="answer-summary">${!a.trim()?'Bạn đã bỏ trống.':right?'✓ Câu trả lời đúng.':'Câu trả lời chưa đúng.'} Đáp án: <strong>${escapeHTML(q.short.answer)}</strong></div><div class="explanation"><strong>Giải thích</strong>${escapeHTML(q.explanation)}</div>`:''}`;
}
function sourcesPanel() {
  return `<details class="sources-panel card"><summary>${icon('shield',16)}Nguồn đối chiếu đáp án</summary><p>Kiến thức được đối chiếu với giáo trình và cơ quan nghiên cứu bên dưới. Các bài tính được giải lại; câu biên tập có bản gốc và ghi chú.</p><div class="source-list">${Object.values(SOURCES).map(src=>`<a href="${escapeHTML(src.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(src.title)}</a>`).join('')}</div></details>`;
}

function questionHTML(q,i) {
  const s=state.session,a=s.answers[q.id],answered=countAnswered(q),feedback=s.submitted||s.mode==='practice'&&answered>0;
  let content='';
  if(q.type==='mcq') {
    content=`<div class="options" role="group" aria-label="Chọn một đáp án cho câu ${i+1}">${q.order.map((originalIndex,displayIndex)=>{
      const selected=a===originalIndex,right=originalIndex===q.answer;
      const cls=feedback?(right?'correct':selected?'incorrect':''):selected?'selected':'';
      return `<button class="option ${cls}" data-action="answer" data-index="${i}" data-option="${originalIndex}" aria-pressed="${selected}" ${feedback?'disabled':''}><span class="letter">${LETTERS[displayIndex]}</span><span class="choice-content">${escapeHTML(q.options[originalIndex])}</span>${feedback&&right?'<span class="choice-mark">Đáp án đúng</span>':feedback&&selected?'<span class="choice-mark">Bạn chọn</span>':''}</button>`;
    }).join('')}</div>${feedback?`<div class="answer-summary">Bạn chọn: <strong>${Number.isInteger(a)?LETTERS[q.order.indexOf(a)]:'Bỏ trống'}</strong> · Đáp án đúng: <strong>${LETTERS[q.order.indexOf(q.answer)]}</strong></div><div class="explanation"><strong>Giải thích</strong>${escapeHTML(q.explanation)}</div>`:''}`;
  } else if(q.type==='tf') {
    content=q.statements.map((st,j)=>{
      const chosen=a&&a[j],hasChoice=typeof chosen==='boolean',show=s.submitted||s.mode==='practice'&&hasChoice;
      const right=hasChoice&&chosen===st.answer;
      return `<div class="statement ${show&&hasChoice?(right?'correct':'incorrect'):''}"><div class="statement-row"><div class="statement-text"><strong>${'abcd'[j]}.</strong> ${escapeHTML(st.text)}</div><div class="tf-controls" role="group" aria-label="Ý ${'abcd'[j]} câu ${i+1}">${[true,false].map(v=>`<button class="tf-choice ${show&&v===st.answer?'right':show&&hasChoice&&chosen===v?'wrong':hasChoice&&chosen===v?'selected':''}" data-action="tf-answer" data-index="${i}" data-statement="${j}" data-value="${v}" aria-pressed="${hasChoice&&chosen===v}" ${show?'disabled':''}>${v?'Đúng':'Sai'}</button>`).join('')}</div></div>${show?`<div class="statement-feedback"><strong>${hasChoice?`Bạn chọn: ${chosen?'Đúng':'Sai'}`:'Bỏ trống'} · Đáp án: ${st.answer?'Đúng':'Sai'}</strong><br>${escapeHTML(st.explanation)}</div>`:''}</div>`;
    }).join('');
    if(s.submitted)content+=`<div class="answer-summary">Điểm câu này: <strong>${pointsFor(q).toFixed(2)} / 1</strong> · Trả lời ${answered}/4 ý.</div>`;
  }
  if(q.type==='short')content=shortHTML(q,i);
  const showNote=s.submitted||(s.mode==='practice'&&(q.type==='short'?s.checked[q.id]:isComplete(q)));
  return `<article id="question-${i}" class="card question-card" data-qindex="${i}" aria-labelledby="question-title-${i}"><div class="question-heading"><h2 id="question-title-${i}">Câu ${i+1}:<span class="question-source">${CHAPTERS[q.chapter].label} · ${LESSONS[q.lesson]?LESSONS[q.lesson].name:''} · ${TYPES[q.type]} · Câu ${q.number} trong đề gốc</span></h2>${q.needReview?'<span class="pill orange">Cần kiểm tra</span>':''}</div>${q.needReview?'<div class="review-alert">Đáp án tham khảo cần được giáo viên đối chiếu; câu này vẫn được tính điểm theo đáp án đã soạn.</div>':''}<div class="question-text">${escapeHTML(q.prompt)}</div>${questionTable(q)}${FIGURES[q.id]?`<img class="question-image" src="${FIGURES[q.id].src}" alt="${escapeHTML(FIGURES[q.id].alt)}" width="${FIGURES[q.id].width}" height="${FIGURES[q.id].height}">`:''}${content}${showNote?referenceLinks(q)+originalDetails(q):''}<div class="question-actions"><div class="navigation"><button class="btn" data-action="navigate" data-index="${i-1}" ${i===0?'disabled':''}>← Câu trước</button><button class="btn soft" data-action="navigate" data-index="${i+1}" ${i===s.questions.length-1?'disabled':''}>Câu sau →</button></div>${!s.submitted?`<button class="flag-button ${s.flags[q.id]?'flagged':''}" data-action="flag" data-index="${i}" aria-pressed="${!!s.flags[q.id]}">${icon('flag',14)} ${s.flags[q.id]?'Đã đánh dấu':'Đánh dấu xem lại'}</button>`:''}</div></article>`;
}
function renderQuestions() {
  const s=state.session;
  const partHeading=q=>`<div class="part-label"><span>${PARTS[q.type]}</span>${q.type==='mcq'?'Trắc nghiệm nhiều lựa chọn':q.type==='tf'?'Trắc nghiệm đúng–sai':'Trả lời ngắn'}</div>`;
  $('#questions-area').innerHTML=s.view==='single'?partHeading(s.questions[s.current])+questionHTML(s.questions[s.current],s.current):s.questions.map((q,i)=>(i===0||q.type!==s.questions[i-1].type?partHeading(q):'')+questionHTML(q,i)).join('');
}
function renderGrid() {
  const s=state.session,complete=answerCount(),total=s.questions.length;
  $('#question-aside').innerHTML=`<div class="aside-title"><h2>Bảng câu hỏi</h2><button class="close-drawer" data-action="close-drawer" aria-label="Đóng bảng câu hỏi">${icon('close',18)}</button></div><p class="aside-progress">Đã hoàn thành <strong>${complete}/${total}</strong> câu</p><div class="progress-track"><div class="progress-fill" style="width:${complete/total*100}%"></div></div>${Object.keys(TYPES).map(type=>{
    const qs=s.questions.map((q,i)=>({q,i})).filter(x=>x.q.type===type);
    if(!qs.length)return '';
    return `<div class="grid-label">${TYPES[type]}</div><div class="question-grid">${qs.map(({q,i})=>`<button class="q-number ${questionState(q)} ${i===s.current?'current':''}" data-action="navigate" data-index="${i}" ${i===s.current?'aria-current="true"':''} aria-label="Câu ${i+1}, ${s.submitted?(countAnswered(q)===0?'bỏ trống':pointsFor(q)===1?'đúng':pointsFor(q)>0?'đúng một phần':'sai'):s.flags[q.id]?'đánh dấu xem lại':isComplete(q)?'đã làm':countAnswered(q)?'đã làm một phần':'chưa làm'}">${i+1}</button>`).join('')}</div>`;
  }).join('')}<div class="legend">${s.submitted?'<span><i class="green"></i>Đúng</span><span><i class="red"></i>Sai</span><span><i class="orange"></i>Đúng một phần</span><span><i class="gray"></i>Bỏ trống</span>':'<span><i></i>Chưa làm</span><span><i class="blue"></i>Đã làm</span><span><i class="orange"></i>Xem lại</span><span><i style="background:#EEF4FF;border-color:#8DB6FF"></i>Làm một phần</span>'}</div><p class="aside-note">${s.submitted?'Câu đúng–sai có thể đạt điểm từng phần. Bấm số câu để xem lời giải.':s.mode==='practice'?'Luyện tập: câu A/B/C/D và từng ý đúng–sai đã trả lời được khóa sau khi hiện giải thích.':'Bạn có thể thay đổi đáp án trước khi nộp bài. Viền đậm đánh dấu câu đang xem.'}</p>`;
  $('#mobile-progress').textContent=`${complete}/${total}`;
}
function updateGridCurrent() {
  if(!state.session)return;
  document.querySelectorAll('.q-number').forEach(b=>{const active=Number(b.dataset.index)===state.session.current;b.classList.toggle('current',active);if(active)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});
}
function navigate(index) {
  const s=state.session;if(index<0||index>=s.questions.length)return;
  s.current=index;closeDrawer();
  if(s.view==='single'){renderQuestions();window.scrollTo({top:0,behavior:'auto'});}
  else $('#question-'+index).scrollIntoView({behavior:'smooth',block:'start'});
  updateGridCurrent();
}
function updateQuestion(index) {
  const s=state.session,old=$('#question-'+index),active=document.activeElement;
  const focusData=old&&active&&old.contains(active)?Object.assign({},active.dataset):null;
  if(old)old.outerHTML=questionHTML(s.questions[index],index);
  renderGrid();
  // Giữ vị trí bàn phím khi câu hỏi được vẽ lại sau một thao tác.
  if(focusData){
    const card=$('#question-'+index);
    const replacement=Array.from(card.querySelectorAll('button')).find(b=>!b.disabled&&Object.keys(focusData).every(k=>b.dataset[k]===focusData[k]));
    if(replacement)replacement.focus({preventScroll:true});
    else {card.setAttribute('tabindex','-1');card.focus({preventScroll:true});}
  }
}
function updateTimer() {
  const s=state.session;if(!s||s.submitted||state.screen!=='exam')return;
  const remaining=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));
  const el=$('#timer');if(el){el.textContent=formatTime(remaining);el.classList.toggle('urgent',remaining<300);}
  if(remaining<=0)finishExam(true);
}
function canAnswer() {
  const s=state.session;if(!s||s.submitted)return false;
  if(Date.now()>=s.deadline){finishExam(true);return false;}return true;
}
function confirmSubmit() {
  if(!canAnswer())return;
  const s=state.session,done=answerCount(),partial=s.questions.filter(q=>countAnswered(q)>0&&!isComplete(q)).length;
  showModal('Xác nhận nộp bài',`<p>Bạn đã làm <strong>${done}/${s.questions.length}</strong> câu, còn <strong>${s.questions.length-done}</strong> câu chưa làm xong. Bạn có chắc muốn nộp?</p>${partial?`<p class="modal-description">Có ${partial} câu đúng–sai mới làm một phần; các ý đã trả lời vẫn được chấm điểm.</p>`:''}<div class="modal-actions"><button class="btn" data-action="close-modal">Tiếp tục làm</button><button class="btn primary" data-action="finish">Nộp bài</button></div>`);
}
function finishExam(auto=false) {
  const s=state.session;if(!s||s.submitted)return;
  clearInterval(timerId);s.submitted=true;s.autoSubmitted=auto;
  s.elapsed=Math.min(s.durationSeconds,Math.max(0,Math.floor((Date.now()-s.startedAt)/1000)));
  s.quiz=s.questions;
  s.totalPoints=s.quiz.reduce((sum,q)=>sum+pointsFor(q,s),0);s.score=s.totalPoints/s.quiz.length*10;
  closeModal(false);closeDrawer();
  saveHistory({title:s.spec.title+' · '+(s.spec.filter==='mixed'?'Tổng hợp':TYPES[s.spec.filter]),mode:s.mode,score:s.score,elapsed:s.elapsed,duration:s.durationSeconds,date:Date.now()});
  renderResult();window.scrollTo(0,0);if(auto)toast('Đã hết '+(s.durationSeconds/60)+' phút. Bài làm đã tự động được nộp.');
}
function renderResult() {
  state.screen='result';renderHeader();$('#footer').classList.remove('hidden');
  const s=state.session,total=s.questions.length,correct=s.questions.filter(q=>pointsFor(q)===1).length,blank=s.questions.filter(q=>!countAnswered(q)).length,wrong=total-correct-blank;
  const partial=s.questions.filter(q=>{const p=pointsFor(q);return p>0&&p<1;}).length;
  const tf=s.questions.filter(q=>q.type==='tf'),tfRight=tf.reduce((n,q)=>n+pointsFor(q)*4,0),tfBlank=tf.reduce((n,q)=>n+4-countAnswered(q),0);
  const percentage=Math.round(s.totalPoints/total*100);
  $('#main').innerHTML=`<div class="result-wrap"><div class="breadcrumb">Ôn tập / ${escapeHTML(s.spec.title)} / Kết quả</div><section class="card result-card"><span class="pill ${s.autoSubmitted?'orange':'green'}">${icon('check',14)} ${s.autoSubmitted?'Hết giờ · Đã tự nộp':'Đã hoàn thành bài làm'}</span><h1>${s.score>=8?'Một bước tiến thật vững!':s.score>=5?'Tiếp tục luyện, bạn sẽ tiến bộ!':'Cùng xem lại để hiểu bài hơn.'}</h1><p>${escapeHTML(s.spec.title)} · Giới hạn ${s.durationSeconds/60} phút · ${s.mode==='practice'?'Luyện tập có xem đáp án':'Thi thử'}</p><div class="result-main"><div class="ring result-ring" style="background:conic-gradient(var(--blue) ${percentage}%,#E9EFF8 0)"><div class="ring-inner"><strong>${percentage}%</strong><small>ĐIỂM ĐẠT ĐƯỢC</small></div></div><div><div class="big-score">${s.score.toFixed(2)}<small> / 10</small></div><div class="score-caption">${s.totalPoints.toFixed(2)} / ${total} điểm gốc</div></div></div><div class="result-stats"><div class="stat"><strong class="green-text">${correct}</strong><span>Câu đúng hoàn toàn</span></div><div class="stat"><strong class="red-text">${wrong}</strong><span>Câu sai / chưa đủ đúng</span></div><div class="stat"><strong>${blank}</strong><span>Câu bỏ trống toàn bộ</span></div><div class="stat"><strong style="font-size:19px">${formatTime(s.elapsed)}</strong><span>Thời gian làm bài</span></div></div><div class="result-actions"><button class="btn primary" data-action="review">Xem lại bài làm ${icon('arrow',16)}</button><button class="btn" data-action="retry">Làm lại</button><button class="btn" data-action="home">Về trang chủ</button></div></section><section class="card result-detail"><h2>Cách tính điểm của bài này</h2><p>Mỗi câu A/B/C/D hoặc trả lời ngắn đúng = 1 điểm. Mỗi ý đúng–sai đúng = 0,25 điểm. Điểm thang 10 = ${s.totalPoints.toFixed(2)} ÷ ${total} × 10 = <strong>${s.score.toFixed(2)}</strong>. Không trừ điểm câu sai hoặc bỏ trống.</p>${tf.length?`<p>Phần đúng–sai: <strong>${tfRight}/${tf.length*4}</strong> ý đúng, ${tf.length*4-tfRight-tfBlank} ý sai, ${tfBlank} ý bỏ trống. Có ${partial} câu đạt điểm một phần, được gộp vào nhóm “sai / chưa đủ đúng” ở trên.</p>`:''}<p>${s.mode==='practice'?'Đây là kết quả luyện tập có hiển thị đáp án trong lúc làm. ':''}${s.questions.filter(q=>q.needReview).length?`Có ${s.questions.filter(q=>q.needReview).length} câu cần kiểm tra lại đáp án, vẫn tính điểm tham khảo. `:''}Các câu biên tập có ghi chú, bản gốc và nguồn đối chiếu trong phần xem lại.</p></section></div>`;
  $('#main').focus({preventScroll:true});
}
function openDrawer() {
  drawerFocus=document.activeElement;$('#question-aside').classList.add('drawer-open');$('#drawer-overlay').classList.remove('hidden');
  $('.mobile-grid-toggle').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';
  $('#question-aside').setAttribute('role','dialog');$('#question-aside').setAttribute('aria-modal','true');$('.close-drawer').focus();
}
function closeDrawer() {
  const aside=$('#question-aside');if(!aside)return;
  const opened=aside.classList.contains('drawer-open');aside.classList.remove('drawer-open');aside.removeAttribute('role');aside.removeAttribute('aria-modal');
  $('#drawer-overlay').classList.add('hidden');$('.mobile-grid-toggle').setAttribute('aria-expanded','false');
  document.body.style.overflow='';if(opened&&drawerFocus&&document.contains(drawerFocus))drawerFocus.focus();
}
/* Dùng một bộ xử lý sự kiện, không tạo hàng trăm hàm onclick trong HTML. */
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
  const action=button.dataset.action,s=state.session;
  if(action==='close-modal'){closeModal();return;}
  if(action==='home'){
    if(s&&!s.submitted&&state.screen==='exam')return;
    closeModal(false);closeDrawer();renderHome();window.scrollTo(0,0);
  } else if(action==='filter'){state.filter=button.dataset.filter;renderHome();}
  else if(action==='chapter'){state.chapter=button.dataset.chapter;renderHome();$('#exam-list-title').scrollIntoView({block:'start'});}
  else if(action==='chapters'){state.chapter='all';renderHome();window.scrollTo(0,0);}
  else if(action==='setup')setupExam(button.dataset.chapter,state.filter,button.dataset.lesson||'all',Number(button.dataset.part||0));
  else if(action==='mode'){
    pendingMode=button.dataset.mode;document.querySelectorAll('.mode-button').forEach(b=>{b.classList.toggle('active',b.dataset.mode===pendingMode);b.setAttribute('aria-pressed',b.dataset.mode===pendingMode);});
  } else if(action==='start')startExam();
  else if(action==='view'){
    s.view=button.dataset.view;closeDrawer();renderExam();window.scrollTo(0,0);
    if(s.view==='all')$('#question-'+s.current).scrollIntoView({block:'start'});
  } else if(action==='navigate')navigate(Number(button.dataset.index));
  else if(action==='flag'){
    if(!canAnswer())return;const i=Number(button.dataset.index),q=s.questions[i];s.flags[q.id]=!s.flags[q.id];updateQuestion(i);
  } else if(action==='answer'){
    if(!canAnswer())return;const i=Number(button.dataset.index),q=s.questions[i];if(s.mode==='practice'&&countAnswered(q))return;
    s.answers[q.id]=Number(button.dataset.option);updateQuestion(i);
  } else if(action==='tf-answer'){
    if(!canAnswer())return;const i=Number(button.dataset.index),j=Number(button.dataset.statement),q=s.questions[i];
    if(!s.answers[q.id])s.answers[q.id]=[null,null,null,null];
    if(s.mode==='practice'&&typeof s.answers[q.id][j]==='boolean')return;
    s.answers[q.id][j]=button.dataset.value==='true';updateQuestion(i);
  } else if(action==='drawer')openDrawer();
  else if(action==='close-drawer')closeDrawer();
  else if(action==='check-short'){
    if(!canAnswer())return;const i=Number(button.dataset.index),q=s.questions[i];
    if(q.type!=='short'||s.mode!=='practice'||s.checked[q.id]||normalizeShort(q,s.answers[q.id])===null)return;
    s.checked[q.id]=true;updateQuestion(i);
  }
  else if(action==='submit')confirmSubmit();
  else if(action==='finish')finishExam(Date.now()>=s.deadline);
  else if(action==='review'){state.screen='review';s.current=0;renderExam();window.scrollTo(0,0);}
  else if(action==='result'){closeDrawer();renderResult();window.scrollTo(0,0);}
  else if(action==='retry'){state.partSize=s.spec.partSize;setupExam(s.spec.chapter,s.spec.filter,s.spec.lesson,s.spec.part);}
  else if(action==='clear-history')showModal('Xóa lịch sử làm bài?',`<p>Toàn bộ kết quả đã lưu trên trình duyệt này sẽ bị xóa.</p><div class="modal-actions"><button class="btn" data-action="close-modal">Giữ lại</button><button class="btn danger" data-action="confirm-clear">Xóa lịch sử</button></div>`);
  else if(action==='confirm-clear'){
    historyMemory=[];try{localStorage.removeItem(HISTORY_KEY);}catch(e){storageWarning=true;}
    closeModal();renderHome();toast('Đã xóa lịch sử làm bài.');
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='chapter-filter'){state.chapter=e.target.value;renderHome();}
  if(e.target.id==='part-size'){state.partSize=Number(e.target.value);renderHome();}
  if(e.target.id==='duration-preset'){
    const custom=e.target.value==='custom';$('#custom-duration-field').hidden=!custom;
    $('#duration-error').hidden=true;$('#duration-custom').removeAttribute('aria-invalid');
    if(custom)$('#duration-custom').focus();
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.hasAttribute('data-short-index')){
    if(!canAnswer())return;
    const s=state.session,i=Number(el.dataset.shortIndex),q=s.questions[i];
    if(s.mode==='practice'&&s.checked[q.id])return;
    s.answers[q.id]=el.value;
    const invalid=!!el.value.trim()&&normalizeShort(q,el.value)===null;
    el.setAttribute('aria-invalid',invalid);$('#short-error-'+i).hidden=!invalid;
    const button=$('#question-'+i+' [data-action="check-short"]');if(button)button.disabled=!el.value.trim()||invalid;
    renderGrid();
  }
  if(e.target.id==='duration-custom'){$('#duration-error').hidden=true;e.target.removeAttribute('aria-invalid');}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.hasAttribute('data-short-index')){
    const button=$('#question-'+e.target.dataset.shortIndex+' [data-action="check-short"]');
    if(button&&!button.disabled){e.preventDefault();button.click();return;}
  }
  const modal=$('.modal'),drawer=$('.question-aside.drawer-open'),scope=modal||drawer;
  if(e.key==='Escape'){if(modal)closeModal();else if(drawer)closeDrawer();return;}
  if(e.key==='Tab'&&scope){
    const items=Array.from(scope.querySelectorAll('button:not(:disabled),select,textarea,input:not(:disabled),a[href],summary,[tabindex="0"]')).filter(el=>el.getClientRects().length);
    if(!items.length){e.preventDefault();return;}
    const first=items[0],last=items[items.length-1];
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===scope)){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===scope)){e.preventDefault();first.focus();}
  }
});
let scrollQueued=false;
window.addEventListener('scroll',()=>{
  if(scrollQueued||!state.session||state.session.view!=='all'||!['exam','review'].includes(state.screen))return;
  scrollQueued=true;requestAnimationFrame(()=>{
    scrollQueued=false;let current=0;const top=($('#header').offsetHeight||80)+40;
    document.querySelectorAll('.question-card').forEach(el=>{if(el.getBoundingClientRect().top<=top)current=Number(el.dataset.qindex);});
    if(current!==state.session.current){state.session.current=current;updateGridCurrent();}
  });
},{passive:true});
window.addEventListener('resize',()=>{if(window.innerWidth>760&&$('.drawer-open'))closeDrawer();});
window.addEventListener('beforeunload',e=>{if(state.session&&!state.session.submitted){e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer();});
/* Kiểm tra cấu trúc dữ liệu trước khi cho người dùng bắt đầu. */
function validateQuestions() {
  const ids=new Set();
  return QUESTIONS.length===126&&QUESTIONS.every(q=>{
    if(ids.has(q.id)||!CHAPTERS[q.chapter]||!LESSONS[q.lesson]||!q.prompt)return false;ids.add(q.id);
    return q.type==='mcq'?q.options.length===4&&q.options.every(x=>typeof x==='string'&&x.trim())&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<4&&!!q.explanation:q.type==='tf'?q.statements.length===4&&q.statements.every(st=>typeof st.answer==='boolean'&&st.text&&st.explanation):q.type==='short'&&q.short&&['number','sequence'].includes(q.short.format)&&normalizeShort(q,q.short.answer)!==null&&!!q.explanation;
  });
}
if(validateQuestions())renderHome();
else {renderHeader();$('#main').innerHTML='<div class="wrap"><div class="note">Dữ liệu câu hỏi chưa hợp lệ. Hãy kiểm tra lại const QUESTIONS trước khi làm bài.</div></div>';}
</script>
